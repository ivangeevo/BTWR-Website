name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Daily rebuild so the mods page's "outdated" badges (current vs.
    # newest Modrinth version) stay fresh even with no code changes.
    - cron: "0 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build static site
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# One-time setup once this repo exists on GitHub:
#   1. Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#   2. Settings -> Secrets and variables -> Actions -> add NOTION_TOKEN
#      and NOTION_DATABASE_ID (see NOTION_SETUP.md). Optional at first —
#      the build falls back to placeholder roadmap data without them.
